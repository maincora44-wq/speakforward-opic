name: App tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: node --check app.js && node --check core.js && node --check lessons.js && node --check finance-data.js && node --check legacy.js && node --check sw.js
      - run: node --check practice-core.js && node --check practice-content.js && node --check practice.js
